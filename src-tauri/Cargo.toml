[package]
name = "ai-usage-widget"
version = "0.1.0"
description = "A private-by-default Windows widget for local AI usage information"
authors = ["AI Usage Widget contributors"]
license = "MIT"
repository = "https://github.com/Relis-lol/ai-usage-widget"
edition = "2024"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ai_usage_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = ["tray-icon"] }
